name: "Migrate database"
description: "Run Flyway migrations against the target environment's database"

inputs:
  ENVIRONMENT:
    description: '"staging" or "production"'
    required: false
    default: staging

runs:
  using: "composite"
  steps:
    - name: Set up OpenJDK 25
      uses: actions/setup-java@v5
      with:
        distribution: "temurin"
        java-version: "25"

    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/repository
        key: ${{ github.job }}-${{ hashFiles('**/pom.xml') }}

    - name: Run script
      shell: bash

      run: |
        bun run .github/scripts/src/db/migrate.ts --environment=${{ inputs.ENVIRONMENT }}
