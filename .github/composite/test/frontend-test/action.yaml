name: "Frontend Test"
description: "Run frontend tests"

runs:
  using: "composite"
  steps:
    - name: Setup CI
      uses: tahminator/pipeline/actions/setup@52eb2a0451daba94989db6a6fa232e689144aa50 # 1.0.96
      with:
        LINT_CI: true

    - name: Set up pnpm
      uses: pnpm/action-setup@v5
      with:
        cache: true
        cache_dependency_path: js/pnpm-lock.yaml
        package_json_file: js/package.json

    - name: Install JS dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      working-directory: js

    - name: Run script
      shell: bash
      run: bun ./.github/scripts/src/test/run-frontend-tests.ts
