name: "Setup"
description: "Setup dependencies required to run pipelines"

inputs:
  SECRETS:
    description: "secrets passed in as JSON."
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup
      uses: tahminator/pipeline/actions/setup@1.0.65
      with:
        INSTALL_SOPS: true
        SECRETS: ${{ inputs.SECRETS }}

    - name: Test CI scripts
      shell: bash
      run: bun run --cwd .github/scripts test
