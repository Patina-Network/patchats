name: CI
run-name: Running continuous integration on ${{ github.actor }}'s commits

# Triggers:
#   - push to ANY branch (catches feature branches, not tags)
#   - pull requests targeting main
# Does NOT fire on tag-only pushes or unrelated events.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  backend-pretest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Format check (Spotless)
        run: ./mvnw spotless:check

      - name: Style check (Checkstyle)
        run: ./mvnw checkstyle:check

      - name: Compile check
        run: ./mvnw compile

  frontend-pretest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run prettier

      - name: Lint
        run: pnpm run lint

      - name: Compile check
        run: pnpm run build

  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit messages (advisory — never fails the build)
        run: |
          for sha in $(git rev-list \
            "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! git log -1 --format=%B "$sha" | sh .githooks/lib/check-message; then
              echo "::warning::Commit ${sha} ('${subject}') doesn't follow the convention — see log above."
            fi
          done
          exit 0
