name: Deploy to production
run-name: Deploying to production triggered by ${{ github.actor }}

concurrency:
  group: deploy-prod
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  checks: write

jobs:
  backend-pretest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/test/backend-pretest

  frontend-pretest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/test/frontend-pretest

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-pretest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/test/backend-test

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-pretest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/test/frontend-test

  migrate-database:
    name: Migrate production database
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    if: github.ref_name == 'main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup CI
        uses: ./.github/composite/setup-ci
        with:
          SECRETS: ${{ toJSON(secrets) }}

      - name: Run workflow
        uses: ./.github/composite/db/migrate
        with:
          ENVIRONMENT: production
